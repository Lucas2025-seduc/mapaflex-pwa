<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="MapaFlex PWA — mapas mentais e conceituais com armazenamento local." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <title>MapaFlex PWA</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MapaFlex</p>
      <h1>Mapas mentais e conceituais</h1>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="secondary" hidden>Instalar app</button>
      <button id="newMapBtn" class="secondary">Novo mapa</button>
      <button id="exportBtn" class="secondary">Exportar</button>
      <label class="secondary file-label">Importar<input id="importInput" type="file" accept="application/json" hidden /></label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <label class="field">
        <span>Título do mapa</span>
        <input id="mapTitle" value="Meu primeiro mapa" maxlength="120" />
      </label>

      <div class="panel">
        <h2>Novo balão</h2>
        <label class="field">
          <span>Título</span>
          <input id="nodeTitle" placeholder="Ex.: Fotossíntese" maxlength="120" />
        </label>
        <label class="field">
          <span>Conteúdo</span>
          <textarea id="nodeText" rows="6" placeholder="Explique o conceito, adicione exemplos, observações ou perguntas..."></textarea>
        </label>
        <button id="addNodeBtn" class="primary">Adicionar balão</button>
      </div>

      <div class="panel compact">
        <h2>Armazenamento</h2>
        <p>Os dados são salvos automaticamente neste navegador usando IndexedDB.</p>
        <p id="saveStatus" class="status">Pronto.</p>
      </div>
    </aside>

    <section class="workspace-wrap">
      <div class="workspace-header">
        <div>
          <strong id="workspaceTitle">Meu primeiro mapa</strong>
          <span id="nodeCount">0 balões</span>
        </div>
        <p>Arraste os balões para reorganizar.</p>
      </div>
      <div id="workspace" class="workspace" aria-label="Área do mapa mental"></div>
    </section>
  </main>

  <template id="nodeTemplate">
    <article class="node" tabindex="0">
      <div class="node-handle" title="Arraste para mover">⋮⋮</div>
      <h3></h3>
      <p></p>
      <div class="node-actions">
        <button class="edit-node secondary small">Editar</button>
        <button class="delete-node danger small">Excluir</button>
      </div>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
