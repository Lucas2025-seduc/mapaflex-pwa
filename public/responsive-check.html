<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MapaFlex Responsive QA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#eef2f7;color:#0f172a}.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #cbd5e1}.bar b{margin-right:auto}.bar button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.stage{min-height:calc(100vh - 60px);padding:18px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.device{width:390px;height:780px;background:#fff;border:8px solid #1e293b;border-radius:24px;box-shadow:0 18px 45px rgba(15,23,42,.2);overflow:hidden;transition:width .2s,height .2s}.device.tablet{width:900px;height:700px;border-radius:18px}.device.landscape{width:844px;height:390px;border-radius:18px}.device iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<div class="bar"><b>MapaFlex • teste responsivo</b><button data-mode="mobile">Celular 390×780</button><button data-mode="tablet">Tablet 900×700</button><button data-mode="landscape">Paisagem 844×390</button></div>
<div class="stage"><div class="device" id="device"><iframe id="preview" src="/?responsive-check=1" title="MapaFlex em viewport de teste"></iframe></div></div>
<script>
const device=document.getElementById('device');
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{device.className='device '+(b.dataset.mode==='mobile'?'':b.dataset.mode);document.getElementById('preview').contentWindow.location.reload();});
</script>
</body>
</html>
